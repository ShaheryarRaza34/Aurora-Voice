name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Required by docker-compose.yml for MySQL (${MYSQL_ROOT_PASSWORD:?...}); value is only used when compose parses the file.
env:
  MYSQL_ROOT_PASSWORD: ci-build-placeholder

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build stack (backend + frontend + validates compose)
        run: docker compose build
