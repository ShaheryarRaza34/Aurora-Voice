services:
  backend:
    build:
      context: ./backend
    container_name: aurora-backend
    ports:
      - "8000:8000"
    environment:
      ASR_MODEL: "tiny.en"
      ASR_DEVICE: "cpu"
      ASR_COMPUTE: "int8"
      PIPER_MODEL: "/app/models/en_US-amy-low.onnx"
    volumes:
      - ./models:/app/models:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    container_name: aurora-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
