version: "3.9"
services:
  backend:
    build:
      context: ./backend
    container_name: voice-backend
    ports:
      - "8000:8000"
    environment:
      ASR_MODEL: "medium"
      ASR_DEVICE: "auto"
      ASR_COMPUTE: "int8_float16"
      PIPER_MODEL: "/app/models/en_US-amy-low.onnx"
      PIPER_OUT: "/app/out.wav"
    volumes:
      - ./models:/app/models

  frontend:
    build:
      context: ./frontend
    container_name: voice-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
